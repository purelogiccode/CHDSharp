# Builds and publishes a CHDSharp release from a version tag:
#   - six platform bundles (framework-dependent single-file CLI) attached to the GitHub release:
#       Windows .zip, Linux .tar.gz, macOS .dmg
#   - build provenance attestations for the bundles and the NuGet package
#   - the CHDSharp NuGet package
#   - the docs/ folder synced to the GitHub wiki (Pages is deployed by pages.yml)
#
# Assets are named CHDSharp_<os>-<arch>_v<version>.<zip|tar.gz|dmg> - the exact names the
# CLI's built-in update check (VersionCheckService) looks up via the GitHub releases API.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundles:
    name: bundles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rids: linux-x64,linux-arm64
          - os: windows-latest
            rids: win-x64,win-arm64
          - os: macos-latest
            rids: osx-x64,osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK 11
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "11.0.x"

      - name: Build release bundles
        shell: pwsh
        run: ./scripts/package-release.ps1 -Rids ${{ matrix.rids }} -OutputPath dist

      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches Directory.Build.props
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = [regex]::Match((Get-Content Directory.Build.props -Raw), "<Version>([^<]+)</Version>").Groups[1].Value
          if ($tag -ne "v$version") { throw "Tag '$tag' does not match version 'v$version' in Directory.Build.props" }
          Write-Host "Releasing v$version"

      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: List bundles
        run: ls -lh dist

      - name: Attest bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Create GitHub release and upload bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "CHDSharp v$ver" --notes-file WhatsNew.md
          fi
          gh release upload "$tag" dist/* --clobber
          gh release view "$tag" --json url,assets --jq '.url, (.assets[]?.name)'

  nuget:
    name: NuGet publish
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDKs (8.0, 9.0, 10.0, 11.0)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Pack and push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
          if curl -fsS -o /dev/null "https://api.nuget.org/v3-flatcontainer/chdsharp/$version/chdsharp.$version.nupkg"; then
            echo "CHDSharp $version is already published - skipping"
            exit 0
          fi
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::NUGET_API_KEY secret is not set"
            exit 1
          fi
          dotnet pack CHDSharpLib/CHDSharpLib.csproj -c Release -warnaserror
          dotnet nuget push "CHDSharpLib/bin/Release/CHDSharp.$version.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Attest NuGet package provenance
        if: hashFiles('CHDSharpLib/bin/Release/CHDSharp.*.nupkg') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "CHDSharpLib/bin/Release/CHDSharp.*.nupkg"

  wiki:
    name: Wiki & Pages
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare wiki pages from docs/
        shell: pwsh
        run: ./scripts/prepare-wiki.ps1 -OutputPath wiki-content

      - name: Push wiki pages
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WIKI_TOKEN:-}" ]; then
            echo "::error::WIKI_TOKEN secret is not set"
            exit 1
          fi
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/purelogiccode/CHDSharp.wiki.git" wiki-repo
          cp -f wiki-content/*.md wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date"
          else
            git commit -m "wiki: sync from docs/ (${GITHUB_REF_NAME})"
            git push
          fi
